name: Test tap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit, install, and test the public formula
        shell: bash
        run: |
          set -euo pipefail
          brew tap --custom-remote yzm1/boundver "$GITHUB_WORKSPACE"
          tap_formula="$(brew --repository yzm1/boundver)/Formula/boundver.rb"
          install -m 0644 "$GITHUB_WORKSPACE/Formula/boundver.rb" "$tap_formula"
          brew audit --strict --online yzm1/boundver/boundver
          brew install --build-from-source yzm1/boundver/boundver
          brew test yzm1/boundver/boundver
          expected=$(sed -n 's|^  url ".*/v\([0-9][0-9.]*\)/boundver-[^"]*"$|\1|p' \
            "$GITHUB_WORKSPACE/Formula/boundver.rb")
          [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(boundver --version)" == *" $expected" ]]
